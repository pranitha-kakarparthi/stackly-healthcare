<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinical Portal Dashboard - Stackly Healthcare System</title>
    <meta
      name="description"
      content="Role-aware clinical healthcare dashboard for patients, doctors, and administrators with telemetry, appointments, and hospital operations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script>
      (function () {
        try {
          var session =
            localStorage.getItem("stackly_current_user") ||
            sessionStorage.getItem("stackly_current_user") ||
            localStorage.getItem("prohealth_current_user");
          if (session) {
            var user = JSON.parse(session);
            if (user && user.role === "Doctor") {
              window.location.replace("doctor-dashboard.html");
            } else if (user && user.role === "Admin") {
              window.location.replace("admin-dashboard.html");
            } else {
              window.location.replace("patient-dashboard.html");
            }
          } else {
            window.location.replace("sign-in.html");
          }
        } catch (e) {
          window.location.replace("patient-dashboard.html");
        }
      })();
    </script>
  </head>
  <body>
    <!-- Pure CSS Page Loader -->
    <div id="page-loader" aria-live="polite">
      <div class="loader-brand">
        <img
          src="assets/images/logo.webp"
          alt="Stackly Healthcare Logo"
          class="brand-logo-img"
        />
        <span class="brand-tag">Healthcare</span>
      </div>
      <div class="loader-spinner"></div>
      <p class="loader-text">Loading authenticated clinical telemetry...</p>
    </div>

    <main class="dashboard-page-wrapper">
      <div class="dashboard-container">
        <!-- Dashboard Sidebar -->
        <aside class="dashboard-sidebar" aria-label="Dashboard Navigation">
          <!-- Portal Brand Header -->
          <div class="dash-brand-header">
            <a
              href="index.html"
              class="brand-logo"
              title="Back to Stackly Healthcare Home"
            >
              <img
                src="assets/images/logo.webp"
                alt="Stackly Healthcare"
                class="brand-logo-img"
              />
              <span class="brand-tag">Portal</span>
            </a>
            <button
              id="dash-sidebar-toggle"
              class="dash-sidebar-toggle-btn"
              aria-label="Toggle Sidebar"
              title="Expand / Collapse Sidebar"
              type="button"
              data-no-action="true"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              >
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- User Badge -->
          <div class="dash-user-badge">
            <div id="dash-sidebar-avatar" class="dash-user-avatar">U</div>
            <div class="dash-user-info">
              <h4 id="dash-user-name">Loading...</h4>
              <span id="dash-role-badge" class="dash-role-badge">Role</span>
            </div>
          </div>

          <!-- Role Nav items populated dynamically -->
          <nav id="dash-sidebar-nav" class="dash-nav"></nav>
        </aside>

        <!-- Mobile Sidebar Backdrop Overlay -->
        <div
          id="dash-sidebar-backdrop"
          class="dash-sidebar-backdrop"
          aria-hidden="true"
        ></div>

        <!-- Dashboard Main Content View -->
        <section
          class="dashboard-main"
          role="region"
          aria-label="Dashboard Content"
        >
          <!-- Top Bar with Greeting & Timestamp -->
          <div class="dashboard-top-bar">
            <div class="dash-greeting-box">
              <h1 id="dash-greeting-text">Welcome back</h1>
              <p id="dash-session-time">Verified Session</p>
            </div>
            <div class="dash-portal-actions">
              <span id="dash-role-badge-top" class="dash-role-badge">Role</span>
              <button
                class="btn btn-secondary btn-sm"
                data-action="404"
                title="Alerts"
              >
                🔔 Alerts
              </button>
              <button id="dash-signout-btn" class="btn btn-danger btn-sm">
                Sign Out
              </button>
            </div>
          </div>

          <!-- Dynamic Content Injected Based on Role: Patient / Doctor / Admin -->
          <div id="dashboard-dynamic-content">
            <!-- Populated by assets/js/dashboard.js -->
          </div>
        </section>
      </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
